<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for Leyla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #131c2e;
    --red: #7a0f1f;
    --red-bright: #a3182b;
    --teal: #1f6f6b;
    --teal-bright: #2c9c96;
    --cream: #e8e3d3;
    --cream-dim: #9aa0ad;
    --font-display: "Fraunces", serif;
    --font-body: "Manrope", sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .lock {
    position: relative;
    z-index: 1;
    width: min(360px, 88vw);
    text-align: center;
    padding: 2.5rem 2rem;
    background: var(--panel);
    border: 1px solid rgba(31, 111, 107, 0.3);
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .lock__snake {
    width: 90px;
    margin: 0 auto 1.25rem;
    display: block;
  }

  .lock__eyebrow {
    margin: 0 0 0.4rem;
    font-size: 0.85rem;
    color: var(--cream-dim);
    letter-spacing: 0.03em;
  }

  .lock__title {
    font-family: var(--font-display);
    font-weight: 600;
    font-style: italic;
    font-size: 1.6rem;
    margin: 0 0 1.75rem;
  }

  .lock__input {
    width: 100%;
    background: var(--bg);
    border: 1px solid rgba(31, 111, 107, 0.4);
    border-radius: 4px;
    color: var(--cream);
    font-family: var(--font-display);
    font-size: 1.6rem;
    letter-spacing: 0.5em;
    text-align: center;
    padding: 0.8rem 0.5rem 0.8rem 0.9rem;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .lock__input:focus {
    border-color: var(--teal-bright);
  }

  .lock.error .lock__input {
    border-color: var(--red-bright);
    animation: shake 0.4s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .lock__btn {
    margin-top: 1.25rem;
    width: 100%;
    background: linear-gradient(135deg, var(--teal-bright), var(--teal));
    border: none;
    color: #06110f;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1rem;
    padding: 0.85rem;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .lock__btn:active { transform: scale(0.97); }

  .lock__hint {
    margin-top: 1rem;
    font-size: 0.8rem;
    color: var(--cream-dim);
    min-height: 1.2em;
  }

  .lock__hint.error { color: var(--red-bright); }

  @media (prefers-reduced-motion: reduce) {
    .lock.error .lock__input { animation: none; }
  }
</style>
</head>
<body>

  <canvas id="sky"></canvas>

  <div class="lock" id="lock">
    <svg class="lock__snake" viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M5,40 C20,10 30,50 45,30 C58,12 68,45 90,25"
        stroke="url(#lockScaleGradient)" stroke-width="9" stroke-linecap="round" />
      <circle cx="90" cy="25" r="3" fill="#e8e3d3"/>
      <defs>
        <linearGradient id="lockScaleGradient" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#7a0f1f"/>
          <stop offset="1" stop-color="#1f6f6b"/>
        </linearGradient>
      </defs>
    </svg>

    <p class="lock__eyebrow">for Leyla, and Leyla only</p>
    <h1 class="lock__title">this bit's locked</h1>

    <form id="lockForm" autocomplete="off">
      <input
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="4"
        class="lock__input"
        id="lockInput"
        placeholder="••••"
        aria-label="Enter the password"
      >
      <button type="submit" class="lock__btn">unlock</button>
    </form>
    <p class="lock__hint" id="lockHint">hint: the day it all started</p>
  </div>

  <script>
    // ============ NIGHT SKY ============
    (function initSky() {
      const canvas = document.getElementById('sky');
      const ctx = canvas.getContext('2d');
      let stars = [];
      let w, h;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        const count = Math.floor((w * h) / 9000);
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.3 + 0.3,
          baseAlpha: Math.random() * 0.5 + 0.3,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.4 + 0.15,
        }));
      }

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (const s of stars) {
          const twinkle = prefersReducedMotion ? 0 : Math.sin(t * 0.001 * s.speed + s.phase) * 0.35;
          const alpha = Math.max(0, Math.min(1, s.baseAlpha + twinkle));
          ctx.beginPath();
          ctx.fillStyle = `rgba(232, 227, 211, ${alpha})`;
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        if (!prefersReducedMotion) requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(draw);
    })();

    // ============ LOCK ============
    const CORRECT = '2108';
    const lock = document.getElementById('lock');
    const form = document.getElementById('lockForm');
    const input = document.getElementById('lockInput');
    const hint = document.getElementById('lockHint');

    // If she's already unlocked this session, skip straight through
    if (sessionStorage.getItem('leylaSiteUnlocked') === 'true') {
      window.location.href = 'home.html';
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim() === CORRECT) {
        sessionStorage.setItem('leylaSiteUnlocked', 'true');
        hint.textContent = 'that\u2019s the one \u2014 come in';
        hint.classList.remove('error');
        lock.classList.remove('error');
        setTimeout(() => { window.location.href = 'home.html'; }, 450);
      } else {
        lock.classList.remove('error');
        void lock.offsetWidth;
        lock.classList.add('error');
        hint.textContent = 'not quite \u2014 try again';
        hint.classList.add('error');
        input.value = '';
        input.focus();
      }
    });
  </script>
</body>
</html>
